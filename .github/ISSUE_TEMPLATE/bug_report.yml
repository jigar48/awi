name: Bug report
description: Report a reproducible problem using synthetic data
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include version and Node/OS. Do not attach private traces or secrets.
    validations:
      required: true
