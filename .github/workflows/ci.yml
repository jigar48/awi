name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18.0', '24.11.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm schemas
      - run: git diff --exit-code -- docs/schemas
      - run: pnpm audit --prod
      - run: pnpm pack --out agent-workflow-inspector-1.0.0.tgz
      - run: pnpm smoke:package
