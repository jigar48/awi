<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <filter id="pCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="940" height="320" rx="14" fill="url(#bg2)" stroke="#30363d" stroke-width="1"/>

  <!-- Pattern 1: Retry Storm & Repeated Errors -->
  <g transform="translate(24, 25)" filter="url(#pCardShadow)">
    <rect width="206" height="270" rx="10" fill="url(#pCardGrad)" stroke="#f85149" stroke-width="1.2"/>
    <rect width="206" height="38" rx="10" fill="#2d1519"/>
    <rect y="28" width="206" height="10" fill="#2d1519"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ff7b72">AWI002 &amp; AWI004</text>
    <text x="14" y="58" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Retry Storms</text>
    <text x="14" y="76" class="font-sans" font-size="11" fill="#8b949e">Repeated failing calls</text>

    <!-- Visual Sequence -->
    <g transform="translate(14, 96)">
      <rect width="178" height="30" rx="4" fill="#381a1f" stroke="#f85149" stroke-width="0.8"/>
      <text x="10" y="20" class="font-mono" font-size="11" fill="#ff7b72">tool(search) ❌ FAIL</text>

      <path d="M 89 32 L 89 42" stroke="#f85149" stroke-width="1.5" stroke-dasharray="2 2"/>
      
      <rect y="44" width="178" height="30" rx="4" fill="#381a1f" stroke="#f85149" stroke-width="0.8"/>
      <text x="10" y="64" class="font-mono" font-size="11" fill="#ff7b72">tool(search) ❌ FAIL</text>

      <path d="M 89 76 L 89 86" stroke="#f85149" stroke-width="1.5" stroke-dasharray="2 2"/>

      <rect y="88" width="178" height="30" rx="4" fill="#381a1f" stroke="#f85149" stroke-width="0.8"/>
      <text x="10" y="108" class="font-mono" font-size="11" fill="#ff7b72">tool(search) ❌ FAIL</text>

      <text x="0" y="146" class="font-sans" font-size="10.5" fill="#fca5a5">💥 Rapid consecutive errors with identical arguments.</text>
    </g>
  </g>

  <!-- Pattern 2: Execution Cycles -->
  <g transform="translate(252, 25)" filter="url(#pCardShadow)">
    <rect width="206" height="270" rx="10" fill="url(#pCardGrad)" stroke="#d29922" stroke-width="1.2"/>
    <rect width="206" height="38" rx="10" fill="#2f2413"/>
    <rect y="28" width="206" height="10" fill="#2f2413"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="700" fill="#e3b341">AWI003</text>
    <text x="14" y="58" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Execution Cycles</text>
    <text x="14" y="76" class="font-sans" font-size="11" fill="#8b949e">Periodic tool loops (A-B-C-A)</text>

    <!-- Visual Sequence -->
    <g transform="translate(14, 96)">
      <rect width="178" height="26" rx="4" fill="#1c2433" stroke="#58a6ff" stroke-width="0.8"/>
      <text x="10" y="17" class="font-mono" font-size="10.5" fill="#79c0ff">1. Tool: read_file</text>

      <rect y="32" width="178" height="26" rx="4" fill="#1c2433" stroke="#bc8cff" stroke-width="0.8"/>
      <text x="10" y="49" class="font-mono" font-size="10.5" fill="#d2a8ff">2. Tool: edit_code</text>

      <rect y="64" width="178" height="26" rx="4" fill="#1c2433" stroke="#3fb950" stroke-width="0.8"/>
      <text x="10" y="81" class="font-mono" font-size="10.5" fill="#7ee787">3. Tool: run_test</text>

      <!-- Loop Indicator -->
      <path d="M 184 77 Q 198 48 184 20" fill="none" stroke="#d29922" stroke-width="2"/>
      <polygon points="184,17 188,24 180,24" fill="#d29922"/>

      <text x="0" y="122" class="font-sans" font-size="11" font-weight="600" fill="#e3b341">🔁 Repeated 3+ times</text>
      <text x="0" y="146" class="font-sans" font-size="10.5" fill="#fde047">Agent trapped in circular non-converging logic.</text>
    </g>
  </g>

  <!-- Pattern 3: Excessive Depth & Complexity -->
  <g transform="translate(480, 25)" filter="url(#pCardShadow)">
    <rect width="206" height="270" rx="10" fill="url(#pCardGrad)" stroke="#a371f7" stroke-width="1.2"/>
    <rect width="206" height="38" rx="10" fill="#241936"/>
    <rect y="28" width="206" height="10" fill="#241936"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="700" fill="#d2a8ff">AWI005</text>
    <text x="14" y="58" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Runaway Tree</text>
    <text x="14" y="76" class="font-sans" font-size="11" fill="#8b949e">Excess depth or operations</text>

    <!-- Visual Tree -->
    <g transform="translate(14, 96)">
      <rect width="178" height="22" rx="4" fill="#261b3d" stroke="#8957e5"/>
      <text x="8" y="15" class="font-mono" font-size="10" fill="#d2a8ff">Root Coordinator</text>

      <g transform="translate(14, 28)">
        <path d="M 0 0 L 0 14 L 10 14" stroke="#8957e5" stroke-width="1.5" fill="none"/>
        <rect x="12" width="152" height="22" rx="4" fill="#261b3d" stroke="#8957e5"/>
        <text x="20" y="15" class="font-mono" font-size="10" fill="#d2a8ff">Subagent A</text>
      </g>

      <g transform="translate(28, 56)">
        <path d="M 0 0 L 0 14 L 10 14" stroke="#8957e5" stroke-width="1.5" fill="none"/>
        <rect x="12" width="138" height="22" rx="4" fill="#261b3d" stroke="#8957e5"/>
        <text x="20" y="15" class="font-mono" font-size="10" fill="#d2a8ff">Sub-task ... [Depth &gt; 20]</text>
      </g>

      <text x="0" y="122" class="font-mono" font-size="11" font-weight="600" fill="#d2a8ff">&gt; 100 total operations</text>
      <text x="0" y="146" class="font-sans" font-size="10.5" fill="#e9d5ff">Catches exponential subagent recursion bugs.</text>
    </g>
  </g>

  <!-- Pattern 4: Resource & Cost Burn -->
  <g transform="translate(708, 25)" filter="url(#pCardShadow)">
    <rect width="206" height="270" rx="10" fill="url(#pCardGrad)" stroke="#3fb950" stroke-width="1.2"/>
    <rect width="206" height="38" rx="10" fill="#142b1a"/>
    <rect y="28" width="206" height="10" fill="#142b1a"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="700" fill="#7ee787">AWI006</text>
    <text x="14" y="58" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Resource Burn</text>
    <text x="14" y="76" class="font-sans" font-size="11" fill="#8b949e">Tokens &amp; cost pinned to errors</text>

    <!-- Visual Burn -->
    <g transform="translate(14, 96)">
      <rect width="178" height="38" rx="4" fill="#132317" stroke="#238636"/>
      <text x="10" y="18" class="font-mono" font-size="11" fill="#7ee787">Wasted Tokens: +84,200</text>
      <text x="10" y="32" class="font-sans" font-size="10" fill="#8b949e">Pinned to culprit leaves</text>

      <rect y="46" width="178" height="38" rx="4" fill="#132317" stroke="#238636"/>
      <text x="10" y="66" class="font-mono" font-size="11" fill="#7ee787">Wasted Cost: $4.21 USD</text>
      <text x="10" y="80" class="font-sans" font-size="10" fill="#8b949e">Direct currency tracking</text>

      <text x="0" y="122" class="font-sans" font-size="11" font-weight="600" fill="#7ee787">💰 Leaf Attribution</text>
      <text x="0" y="146" class="font-sans" font-size="10.5" fill="#bbf7d0">Pinpoints financial waste directly to flawed loops.</text>
    </g>
  </g>
</svg>
