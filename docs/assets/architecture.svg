<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2d42"/>
      <stop offset="100%" stop-color="#131e2e"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="380" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- Section 1: Ingestion & Formats -->
  <g transform="translate(30, 40)" filter="url(#cardShadow)">
    <rect width="250" height="300" rx="10" fill="url(#cardGrad1)" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="10" fill="#1f2937"/>
    <rect x="0" y="32" width="250" height="10" fill="#1f2937"/>
    <line x1="0" y1="42" x2="250" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="125" y="27" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#93c5fd">1. TRACE INGESTION</text>

    <!-- Source Items -->
    <g transform="translate(16, 60)">
      <!-- AI Agents Box -->
      <rect width="218" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="14" y="25" class="font-sans" font-size="12" font-weight="600" fill="#e5e7eb">Agent Frameworks</text>
      <text x="14" y="43" class="font-mono" font-size="11" fill="#9ca3af">LangChain, CrewAI, AutoGen, SDKs</text>

      <!-- Trace Format Box -->
      <rect y="68" width="218" height="74" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="14" y="90" class="font-sans" font-size="12" font-weight="600" fill="#38bdf8">Supported Trace Formats</text>
      <text x="14" y="110" class="font-mono" font-size="11" fill="#cbd5e1">• Canonical AWI JSON (v1)</text>
      <text x="14" y="128" class="font-mono" font-size="11" fill="#cbd5e1">• OpenTelemetry OTLP JSON</text>

      <!-- Privacy Callout -->
      <rect y="154" width="218" height="60" rx="6" fill="#1e1e2d" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="176" class="font-sans" font-size="11" font-weight="700" fill="#a5b4fc">🔒 Privacy By Default</text>
      <text x="14" y="196" class="font-sans" font-size="10.5" fill="#94a3b8">Payloads &amp; raw arguments redacted.</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 288 190 L 322 190" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="328,190 320,186 320,194" fill="#60a5fa"/>

  <!-- Section 2: Core Inspection Engine -->
  <g transform="translate(336, 30)" filter="url(#cardShadow)">
    <rect width="290" height="320" rx="10" fill="url(#coreGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="0" y="0" width="290" height="44" rx="10" fill="#0f2136"/>
    <rect x="0" y="34" width="290" height="10" fill="#0f2136"/>
    <line x1="0" y1="44" x2="290" y2="44" stroke="#1e3a5f" stroke-width="1"/>
    <text x="145" y="28" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#38bdf8">2. LOCAL-FIRST LINTER</text>

    <!-- Sub-boxes for Rules -->
    <g transform="translate(16, 56)">
      <text x="6" y="14" class="font-sans" font-size="11" font-weight="700" fill="#94a3b8">DETERMINISTIC HEURISTICS (NO LLM)</text>

      <rect y="24" width="258" height="34" rx="5" fill="#0b1726" stroke="#1e3a5f"/>
      <text x="12" y="45" class="font-mono" font-size="11" font-weight="600" fill="#f87171">AWI001 &amp; AWI002</text>
      <text x="130" y="45" class="font-sans" font-size="11" fill="#94a3b8">Duplicate / Failing Calls</text>

      <rect y="64" width="258" height="34" rx="5" fill="#0b1726" stroke="#1e3a5f"/>
      <text x="12" y="85" class="font-mono" font-size="11" font-weight="600" fill="#fbbf24">AWI003</text>
      <text x="78" y="85" class="font-sans" font-size="11" fill="#94a3b8">Execution Cycles (A-B-C-A)</text>

      <rect y="104" width="258" height="34" rx="5" fill="#0b1726" stroke="#1e3a5f"/>
      <text x="12" y="125" class="font-mono" font-size="11" font-weight="600" fill="#f87171">AWI004</text>
      <text x="78" y="125" class="font-sans" font-size="11" fill="#94a3b8">Rapid Retry Storms</text>

      <rect y="144" width="258" height="34" rx="5" fill="#0b1726" stroke="#1e3a5f"/>
      <text x="12" y="165" class="font-mono" font-size="11" font-weight="600" fill="#fbbf24">AWI005</text>
      <text x="78" y="165" class="font-sans" font-size="11" fill="#94a3b8">Runaway Depth &amp; Ops</text>

      <rect y="184" width="258" height="34" rx="5" fill="#0b1726" stroke="#1e3a5f"/>
      <text x="12" y="205" class="font-mono" font-size="11" font-weight="600" fill="#34d399">AWI006</text>
      <text x="78" y="205" class="font-sans" font-size="11" fill="#94a3b8">Associated Token &amp; Cost Waste</text>

      <rect y="226" width="258" height="24" rx="4" fill="#032541"/>
      <text x="129" y="242" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#38bdf8">⚡ 100% Offline • Zero Network Calls</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 634 190 L 668 190" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="674,190 666,186 666,194" fill="#60a5fa"/>

  <!-- Section 3: Actionable Outputs -->
  <g transform="translate(682, 40)" filter="url(#cardShadow)">
    <rect width="230" height="300" rx="10" fill="url(#cardGrad1)" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="42" rx="10" fill="#1f2937"/>
    <rect x="0" y="32" width="230" height="10" fill="#1f2937"/>
    <line x1="0" y1="42" x2="230" y2="42" stroke="#374151" stroke-width="1"/>
    <text x="115" y="27" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#34d399">3. OUTPUTS &amp; CI</text>

    <g transform="translate(14, 56)">
      <!-- Terminal Output -->
      <rect width="202" height="64" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="24" class="font-sans" font-size="12" font-weight="700" fill="#f3f4f6">🖥️ Human Terminal</text>
      <text x="12" y="44" class="font-sans" font-size="10.5" fill="#9ca3af">Formatted findings, severity, evidence &amp; operations list.</text>

      <!-- JSON Report -->
      <rect y="74" width="202" height="64" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="98" class="font-sans" font-size="12" font-weight="700" fill="#f3f4f6">📄 JSON Report File</text>
      <text x="12" y="118" class="font-sans" font-size="10.5" fill="#9ca3af">Schema-validated JSON for test suites &amp; automation.</text>

      <!-- CI Pipeline Gating -->
      <rect y="148" width="202" height="74" rx="6" fill="#111827" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="172" class="font-sans" font-size="12" font-weight="700" fill="#34d399">🚦 CI/CD Gatekeeper</text>
      <text x="12" y="192" class="font-mono" font-size="10.5" fill="#e5e7eb">Exit 0: Below threshold</text>
      <text x="12" y="208" class="font-mono" font-size="10.5" fill="#fca5a5">Exit 2: Threshold failed</text>
    </g>
  </g>
</svg>
